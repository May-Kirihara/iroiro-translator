# iroiro_v05_full.toml — v0.5 全項目記述の iroiro.toml（T132-T157 用）
#
# 計画書 §2.4 の toml 例をそのまま（api_base 等の接続設定も含む）。
# v0.5 の LLM 挙動中核 3 項目（system_prompt / reject_phrases / [iroiro.rec_hints]）
# を全て含む。「正常系」のテストで使う。
#
# v0.6 追加分（Plan 006 §5）: skip_records も必須・14 件（NG ガイド §9.1 準拠）。
#
# 重要（TOML 構文・B5 指摘）: [iroiro.rec_hints] 配下のキーは "MGEF:FULL" のように
# ":" を含むため、必ず quoted key（"MGEF:FULL" のように " で囲む）で書くこと。
# TOML 1.0 の bare key は [A-Za-z0-9_-] のみ許容するため、":" を含むと parse error になる。

[iroiro]
# === 接続設定（省略可・CLI フラグで上書き可能）===
api_base      = "http://localhost:8081/v1"
api_key       = "iroiro"
model         = "ggml-org/gemma-4-12B-it-GGUF:Q4_K_M"
timeout       = 120.0
concurrency   = 1
max_chars     = 4000
retry_failed  = false

# === v0.5 新規（LLM 挙動中核・必須）===
system_prompt = """
Skyrim MOD の英文を日本語に翻訳する。
固有名詞・ <alias=...> 等のプレースホルダ・ <br>・改行文字・ # 記号は
**そのまま維持** すること。
簡潔で自然な日本語。**訳文のみ** 出力し、
説明・マークダウン・ラベル・複数行は禁止。
"""

reject_phrases = [
  "了解", "了解しました", "了解いたしました",
  "承知", "承知いたしました", "承知しております",
  "かしこまりました",
  "翻訳", "翻訳します", "翻訳しました", "翻訳結果", "翻訳文",
  "訳文", "訳しました", "訳します",
  "以下に訳します", "訳文を示します",
  "以下の通りです", "以下の通りとなります", "次のようになります",
  "上記の通りです",
]

# === v0.6 新規（必須・NG ガイド §9.1 Conservative Preset・EDID 抜き）===
skip_records = [
  "HDPT:FULL", "FURN:FULL", "CLAS:FULL", "DOOR:FULL",
  "FACT:FULL", "CLFM:FULL", "TREE:FULL", "MGEF:FULL",
  "RACE:FULL", "EXPL:FULL", "HAZD:FULL", "BPTD:BPTN",
  "FLST:FULL", "KYWD:FULL",
]

[iroiro.rec_hints]
"MGEF:FULL" = "魔法の効果名。1〜4語程度の簡潔な表現。"
"MGEF:DESC" = "魔法の効果の説明文。自然な日本語の文章。"
"ARMO:FULL" = "防具の名称。1〜4語程度。"
"ARMO:DESC" = "防具の説明文。"
"BOOK:FULL" = "書籍のタイトル。簡潔な表現。"
"BOOK:DESC" = "書籍の本文。物語風の自然な日本語。"
"WEAP:FULL" = "武器の名称。1〜4語程度。"
"SPEL:FULL" = "スペル（能力）の名称。"
"ACTI:FULL" = "アクティベータ（家具/看板等）の名称。"
"ALCH:FULL" = "錬金術素材/薬の名称。"
"ENCH:FULL" = "エンチャント（効果）の名称。"
"INGR:FULL" = "錬金術素材の名称。"
"NPC_:FULL" = "NPC の名称。固有名詞として扱う。"
"FACT:FULL" = "派閥（ファクション）の名称。"
"INFO:RNAM" = "NPC のセリフ（会話の応答）。自然な会話文。"
"QUST:FULL" = "クエストのタイトル。"
"RACE:FULL" = "種族の名称。"
"CLAS:FULL" = "クラス（職業）の名称。"
