# iroiro_full.toml — 全項目記述の iroiro.toml（T89 / T104 / T105 / T108 / T109 用）
#
# 検証容易性のため、全ての値を iroiro/cli.py の DEFAULT_* と明確に異なる値にする:
#   DEFAULT_API_BASE    = "http://localhost:8081/v1"
#   DEFAULT_API_KEY     = "iroiro"
#   DEFAULT_MODEL       = "ggml-org/gemma-4-12B-it-GGUF:Q4_K_M"
#   DEFAULT_CONCURRENCY = 1
#   DEFAULT_MAX_CHARS   = 4000
#   DEFAULT_TIMEOUT     = 120.0
#
# v0.5 追加分（LLM 挙動中核・必須）: system_prompt / reject_phrases / [iroiro.rec_hints]
#   これらは WP-1 段階では load_config の未知キー扱い（WARNING + 無視）となり、
#   既存テスト（T89 等）の result dict には含まれない。WP-2 完了後に必須検証が
#   走り result dict に含まれるようになる（その際に既存テストの assertion を更新）。

[iroiro]
api_base    = "http://from-toml:9999/v1"
api_key     = "toml-secret-key"
model       = "toml-model-name"
timeout     = 99.0
concurrency = 7
max_chars   = 7777

# === v0.5 新規（LLM 挙動中核・必須）===
system_prompt = """
Skyrim MOD の英文を日本語に翻訳する。
固有名詞・ <alias=...> 等のプレースホルダ・ <br>・改行文字・ # 記号は
**そのまま維持** すること。
簡潔で自然な日本語。**訳文のみ** 出力し、
説明・マークダウン・ラベル・複数行は禁止。
"""

reject_phrases = [
  "了解", "了解しました", "了解いたしました",
  "承知", "承知いたしました", "承知しております",
  "かしこまりました",
  "翻訳", "翻訳します", "翻訳しました", "翻訳結果", "翻訳文",
  "訳文", "訳しました", "訳します",
  "以下に訳します", "訳文を示します",
  "以下の通りです", "以下の通りとなります", "次のようになります",
  "上記の通りです",
]

[iroiro.rec_hints]
"MGEF:FULL" = "魔法の効果名。1〜4語程度の簡潔な表現。"
"MGEF:DESC" = "魔法の効果の説明文。自然な日本語の文章。"
"ARMO:FULL" = "防具の名称。1〜4語程度。"
"ARMO:DESC" = "防具の説明文。"
"BOOK:FULL" = "書籍のタイトル。簡潔な表現。"
"BOOK:DESC" = "書籍の本文。物語風の自然な日本語。"
"WEAP:FULL" = "武器の名称。1〜4語程度。"
"SPEL:FULL" = "スペル（能力）の名称。"
"ACTI:FULL" = "アクティベータ（家具/看板等）の名称。"
"ALCH:FULL" = "錬金術素材/薬の名称。"
"ENCH:FULL" = "エンチャント（効果）の名称。"
"INGR:FULL" = "錬金術素材の名称。"
"NPC_:FULL" = "NPC の名称。固有名詞として扱う。"
"FACT:FULL" = "派閥（ファクション）の名称。"
"INFO:RNAM" = "NPC のセリフ（会話の応答）。自然な会話文。"
"QUST:FULL" = "クエストのタイトル。"
"RACE:FULL" = "種族の名称。"
"CLAS:FULL" = "クラス（職業）の名称。"
