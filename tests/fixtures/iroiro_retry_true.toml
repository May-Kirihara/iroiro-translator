# iroiro_retry_true.toml — retry_failed = true のみ記述（T110 / T126 用）
#
# Plan 004 §4.4: retry_failed は厳格 bool のみ許可。``true`` は ``True`` として
# 反映される（resume 時に failed エントリを state=pending に戻す = 再翻訳対象）。
# 検証容易性のため retry_failed 以外の接続設定項目は書かない（他は内蔵デフォルトに落ちる）。
#
# v0.5 追加分（LLM 挙動中核・必須）: system_prompt / reject_phrases / [iroiro.rec_hints]
#   T110 では ``result == {"retry_failed": True}`` の厳密比較をするが、WP-1 段階では
#   3 新項目は未知キー扱いで無視されるため比較は成功する。WP-2 完了後に assertion 更新。
#
# v0.6 追加分（Plan 006 §5）: skip_records
#   同様に WP-1 段階では未知キー扱い。WP-2 完了後に result dict に含まれる。

[iroiro]
retry_failed = true

# === v0.5 新規（LLM 挙動中核・必須）===
system_prompt = """
Skyrim MOD の英文を日本語に翻訳する。
"""
reject_phrases = ["了解", "翻訳します"]

# === v0.6 新規（必須）===
skip_records = [
  "HDPT:FULL", "FURN:FULL", "CLAS:FULL", "DOOR:FULL",
  "FACT:FULL", "CLFM:FULL", "TREE:FULL", "MGEF:FULL",
  "RACE:FULL", "EXPL:FULL", "HAZD:FULL", "BPTD:BPTN",
  "FLST:FULL", "KYWD:FULL",
]

[iroiro.rec_hints]
"MGEF:FULL" = "魔法の効果名。"
