# iroiro_v06_missing_skip_records.toml — skip_records 欠損（T159 / T147 用）
#
# v0.6（Plan 006 §5.3）で [iroiro] skip_records が必須化される。本 fixture は
# v0.5 の全必須項目（system_prompt / reject_phrases / [iroiro.rec_hints]）を含むが、
# skip_records だけ欠損。WP-2 完了後に load_config が必須エラー（IroiroError）
# を送出することを検証する。
# 期待されるエラーメッセージ（Plan 006 §5.3）: "[iroiro] skip_records is required in <path>"

[iroiro]
api_base      = "http://localhost:8081/v1"
api_key       = "iroiro"
model         = "ggml-org/gemma-4-12B-it-GGUF:Q4_K_M"
timeout       = 120.0
concurrency   = 1
max_chars     = 4000
retry_failed  = false

system_prompt = """
Skyrim MOD の英文を日本語に翻訳する。
"""

reject_phrases = [
  "了解", "了解しました", "了解いたしました",
  "翻訳します",
]

# skip_records は意図的に書かない（必須エラー検証用）

[iroiro.rec_hints]
"MGEF:FULL" = "魔法の効果名。"
"BOOK:DESC" = "書籍の本文。"
