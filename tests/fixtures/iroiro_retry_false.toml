# iroiro_retry_false.toml — retry_failed = false のみ記述（T111 / T127 用）
#
# Plan 004 §4.4: retry_failed のデフォルトは False（後方互換・v0.3 までと同じ挙動）。
# 明示的に ``false`` と書いた場合も load_config は ``{"retry_failed": False}`` を返す
# （dict のキーに含まれる点が「未記述」と異なる・呼出側の _resolve で False が明示採用される）。
#
# v0.5 追加分（LLM 挙動中核・必須）: system_prompt / reject_phrases / [iroiro.rec_hints]
#
# v0.6 追加分（Plan 006 §5）: skip_records

[iroiro]
retry_failed = false

# === v0.5 新規（LLM 挙動中核・必須）===
system_prompt = """
Skyrim MOD の英文を日本語に翻訳する。
"""
reject_phrases = ["了解", "翻訳します"]

# === v0.6 新規（必須）===
skip_records = [
  "HDPT:FULL", "FURN:FULL", "CLAS:FULL", "DOOR:FULL",
  "FACT:FULL", "CLFM:FULL", "TREE:FULL", "MGEF:FULL",
  "RACE:FULL", "EXPL:FULL", "HAZD:FULL", "BPTD:BPTN",
  "FLST:FULL", "KYWD:FULL",
]

[iroiro.rec_hints]
"MGEF:FULL" = "魔法の効果名。"
